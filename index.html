<!DOCTYPE html>
<html lang="en">

 <!-- Telegram WebApp API -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <title>Telegram Crypto Mining</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">

      <div class="profile">

        <img id="userPhoto"
        class="avatar"
        src="https://i.pravatar.cc/100"/>

        <div>

          <div class="welcome">
            Welcome Back
          </div>

          <div class="username"
          id="username">
            Miner
          </div>

        </div>

      </div>

      <div class="notification">
        <i class="fa-solid fa-bell"></i>
      </div>

    </div>

    <!-- BALANCE -->
    <div class="balance-card">

      <div class="small-title">
        Total Balance
      </div>

      <div class="balance"
      id="balance">
        0.0000 BTC
      </div>

      <div class="usd"
      id="usdBalance">
        ≈ $0.00
      </div>

      <div class="mining-status">

        <div class="active-badge">
          Mining Active
        </div>

        <div class="online-users"
        id="onlineUsers">
          4,823 miners online
        </div>

      </div>

    </div>

    <!-- STATS -->
    <div class="stats-grid">

      <div class="stat-card">

        <div class="stat-title">
          Hash Rate
        </div>

        <div class="stat-value"
        id="hashRate">
          1.20 GH/s
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-title">
          Energy
        </div>

        <div class="stat-value"
        id="energyText">
          100%
        </div>

        <div class="progress-bar">
          <div class="progress"
          id="energyBar"></div>
        </div>

      </div>

    </div>

    <!-- MINERS -->
    <div class="section">

      <div class="section-title">
        Cloud Miners
      </div>

      <div class="miner-card">

        <div class="miner-left">

          <div class="miner-icon">
            <i class="fa-solid fa-microchip"></i>
          </div>

          <div>

            <div class="miner-name">
              GPU Miner
            </div>

            <div class="miner-speed">
              5 GH/s Speed
            </div>

          </div>

        </div>

        <button class="upgrade-btn"
        onclick="upgradeMiner()">
          Upgrade
        </button>

      </div>

      <div class="miner-card">

        <div class="miner-left">

          <div class="miner-icon">
            <i class="fa-solid fa-server"></i>
          </div>

          <div>

            <div class="miner-name">
              ASIC Miner
            </div>

            <div class="miner-speed">
              20 GH/s Speed
            </div>

          </div>

        </div>

        <button class="locked-btn">
          Locked
        </button>

      </div>

    </div>

    <!-- CHART -->
    <div class="section">

      <div class="section-title">
        Mining Statistics
      </div>

      <canvas id="miningChart"></canvas>

    </div>

    <!-- MARKET -->
    <div class="section">

      <div class="section-title">
        Crypto Market
      </div>

      <div id="marketList"></div>

    </div>

    <!-- DAILY REWARD -->
    <div class="reward-card">

      <div>

        <div class="reward-title">
          Daily Reward
        </div>

        <div class="reward-sub">
          Claim free mining bonus
        </div>

      </div>

      <button class="claim-btn"
      onclick="claimReward()">
        Claim
      </button>

    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">

      <div class="nav-item active">
        <i class="fa-solid fa-house"></i>
        Home
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-wallet"></i>
        Wallet
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        Market
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-users"></i>
        Referral
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-user"></i>
        Profile
      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
