<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoLive Pro - Analytics & Forecast</title>
    
    <!-- Chart.js Library for Advanced Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Modern Dark Crypto Theme */
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --text-main: #EAECEF;
            --text-muted: #848E9C;
            --up-color: #2ebd85;
            --down-color: #f6465d;
            --primary-accent: #FCD535; /* Binance Yellow */
            --border-color: #2b3139;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-accent);
            letter-spacing: 1px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--up-color);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--up-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(46, 189, 133, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0); }
        }

        /* Main Container */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Coin Selector Tabs */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
        }

        /* Top Widget Area */
        .top-widgets {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .top-widgets { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        .price-display h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-muted);
        }

        .current-price {
            font-size: 48px;
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .change-24h {
            font-size: 18px;
            font-weight: bold;
        }

        .up { color: var(--up-color); }
        .down { color: var(--down-color); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-item p {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .stat-item h3 {
            margin: 0;
            font-size: 20px;
        }

        /* Chart Area */
        .chart-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-header h3 { margin: 0; }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        /* Forecast Area */
        .forecast-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .forecast-card {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px dashed var(--border-color);
        }

        .forecast-card .day {
            color: var(--primary-accent);
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .forecast-card .price {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CryptoLive Pro</div>
        <div class="live-indicator">
            <div class="dot"></div>
            Market Live
        </div>
    </header>

    <div class="container">
        
        <!-- Coin Selection -->
        <div class="tabs" id="coinTabs">
            <button class="tab-btn active" onclick="loadCoinData('BTC')">Bitcoin (BTC)</button>
            <button class="tab-btn" onclick="loadCoinData('ETH')">Ethereum (ETH)</button>
            <button class="tab-btn" onclick="loadCoinData('BNB')">Binance Coin (BNB)</button>
            <button class="tab-btn" onclick="loadCoinData('SOL')">Solana (SOL)</button>
        </div>

        <div class="top-widgets">
            <!-- Live Price Card -->
            <div class="card price-display">
                <h2 id="coinName">Bitcoin (BTC)</h2>
                <div class="current-price" id="livePrice">$64,520.00</div>
                <div class="change-24h up" id="change24h">+2.45% (24h)</div>
            </div>

            <!-- Last 1 Year Stats Summary -->
            <div class="card stats-grid">
                <div class="stat-item">
                    <p>Market Cap</p>
                    <h3 id="marketCap">$1.27 T</h3>
                </div>
                <div class="stat-item">
                    <p>24h Volume</p>
                    <h3 id="volume">$34.5 B</h3>
                </div>
                <div class="stat-item">
                    <p>1 Year High (Past 365 Days)</p>
                    <h3 id="yearHigh" class="up">$73,750.00</h3>
                </div>
                <div class="stat-item">
                    <p>1 Year Low (Past 365 Days)</p>
                    <h3 id="yearLow" class="down">$24,800.00</h3>
                </div>
            </div>
        </div>

        <!-- 1 Year History + 7 Day Forecast Chart -->
        <div class="chart-section">
            <div class="chart-header">
                <h3>Price History (Last 1 Year) & 7-Day Forecast AI Prediction</h3>
            </div>
            <div class="chart-container">
                <canvas id="cryptoChart"></canvas>
            </div>
        </div>

        <!-- 7 Days Detailed Forecast -->
        <div class="forecast-section">
            <h3>AI Price Forecast (Next 7 Days)</h3>
            <div class="forecast-grid" id="forecastGrid">
                <!-- Data will be injected via JS -->
            </div>
        </div>

    </div>

    <script>
        // Database for base prices to simulate reality
        const coinData = {
            'BTC': { name: 'Bitcoin (BTC)', basePrice: 65420, cap: '$1.28 T', vol: '$35.2 B' },
            'ETH': { name: 'Ethereum (ETH)', basePrice: 3450, cap: '$415.5 B', vol: '$14.1 B' },
            'BNB': { name: 'Binance Coin (BNB)', basePrice: 590, cap: '$87.3 B', vol: '$1.8 B' },
            'SOL': { name: 'Solana (SOL)', basePrice: 145, cap: '$65.4 B', vol: '$2.9 B' }
        };

        let currentCoin = 'BTC';
        let chartInstance = null;
        let liveTickerInterval = null;

        // Utility: Generate realistic looking historical and forecast data
        function generateMarketData(basePrice) {
            let historyPrices = [];
            let forecastPrices = [];
            let labels = [];
            
            // Generate last 365 days history
            let currentSimulatedPrice = basePrice * 0.4; // Started lower a year ago
            let high = currentSimulatedPrice;
            let low = currentSimulatedPrice;

            let today = new Date();
            
            for(let i = 365; i >= 0; i--) {
                let d = new Date(today);
                d.setDate(d.getDate() - i);
                labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                
                // Random walk volatility
                let change = 1 + (Math.random() * 0.08 - 0.038); 
                currentSimulatedPrice = currentSimulatedPrice * change;
                
                if(i === 0) currentSimulatedPrice = basePrice; // Force current price to match today
                
                if(currentSimulatedPrice > high) high = currentSimulatedPrice;
                if(currentSimulatedPrice < low) low = currentSimulatedPrice;

                historyPrices.push(currentSimulatedPrice);
            }

            // Generate next 7 days forecast
            let forecastSimulatedPrice = basePrice;
            for(let i = 1; i <= 7; i++) {
                let d = new Date(today);
                d.setDate(d.getDate() + i);
                labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + " (Est)");
                
                // Slightly different logic for forecast
                let change = 1 + (Math.random() * 0.05 - 0.02); 
                forecastSimulatedPrice = forecastSimulatedPrice * change;
                forecastPrices.push(forecastSimulatedPrice);
            }

            return { historyPrices, forecastPrices, labels, high, low };
        }

        // Utility: Format currency
        function formatCurrency(num) {
            return '$' + num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function loadCoinData(coin) {
            currentCoin = coin;
            const data = coinData[coin];
            
            // Update Active Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Generate Mock Data
            const marketData = generateMarketData(data.basePrice);

            // Update DOM Elements
            document.getElementById('coinName').innerText = data.name;
            document.getElementById('livePrice').innerText = formatCurrency(data.basePrice);
            document.getElementById('marketCap').innerText = data.cap;
            document.getElementById('volume').innerText = data.vol;
            document.getElementById('yearHigh').innerText = formatCurrency(marketData.high);
            document.getElementById('yearLow').innerText = formatCurrency(marketData.low);

            // Generate 24h change mock
            let changePercent = (Math.random() * 10 - 5).toFixed(2);
            let changeEl = document.getElementById('change24h');
            changeEl.innerText = `${changePercent > 0 ? '+' : ''}${changePercent}% (24h)`;
            changeEl.className = `change-24h ${changePercent > 0 ? 'up' : 'down'}`;

            // Render Chart
            renderChart(marketData.labels, marketData.historyPrices, marketData.forecastPrices);

            // Render 7-day Forecast Grid
            renderForecastGrid(marketData.forecastPrices);

            // Start Live Ticker
            startLiveTicker(data.basePrice);
        }

        function renderChart(labels, historyData, forecastData) {
            const ctx = document.getElementById('cryptoChart').getContext('2d');
            
            // Destroy previous chart instance if exists
            if(chartInstance) {
                chartInstance.destroy();
            }

            // To make forecast connect to history, we pad arrays with nulls
            let historyDataset = [...historyData, ...Array(7).fill(null)];
            
            // Forecast starts from the last history point to make line continuous
            let forecastDataset = Array(365).fill(null);
            forecastDataset.push(historyData[historyData.length - 1]); // Connect point
            forecastDataset = [...forecastDataset, ...forecastData];

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Historical Price (1Y)',
                            data: historyDataset,
                            borderColor: '#2ebd85',
                            backgroundColor: 'rgba(46, 189, 133, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            pointRadius: 0, // Hide points for clean line
                            tension: 0.1
                        },
                        {
                            label: 'Forecast (7 Days)',
                            data: forecastDataset,
                            borderColor: '#FCD535',
                            borderWidth: 2,
                            borderDash: [5, 5], // Dashed line for forecast
                            fill: false,
                            pointRadius: 3,
                            pointBackgroundColor: '#FCD535',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: { labels: { color: '#EAECEF' } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) label += formatCurrency(context.parsed.y);
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#848E9C', maxTicksLimit: 12 }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#848E9C',
                                callback: function(value) { return '$' + value.toLocaleString(); }
                            }
                        }
                    }
                }
            });
        }

        function renderForecastGrid(forecastPrices) {
            const grid = document.getElementById('forecastGrid');
            grid.innerHTML = ''; // clear old data

            let today = new Date();
            forecastPrices.forEach((price, index) => {
                let d = new Date(today);
                d.setDate(d.getDate() + index + 1);
                let dayName = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                let card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <div class="day">${dayName}</div>
                    <div class="price">${formatCurrency(price)}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Live Ticker Simulator: Updates price every 2 seconds slightly
        function startLiveTicker(basePrice) {
            if(liveTickerInterval) clearInterval(liveTickerInterval);
            
            let currentSimPrice = basePrice;
            
            liveTickerInterval = setInterval(() => {
                // Change price by -0.1% to +0.1%
                let volatility = (Math.random() * 0.002) - 0.001; 
                currentSimPrice = currentSimPrice + (currentSimPrice * volatility);
                
                let priceEl = document.getElementById('livePrice');
                priceEl.innerText = formatCurrency(currentSimPrice);
                
                // Add flash effect
                priceEl.style.color = volatility > 0 ? 'var(--up-color)' : 'var(--down-color)';
                setTimeout(() => { priceEl.style.color = 'var(--text-main)'; }, 500);

            }, 2500);
        }

        // Initialize App with BTC
        window.onload = () => {
            // Mock click event structure for initial load
            window.event = { target: document.querySelector('.tab-btn') };
            loadCoinData('BTC');
        };
    </script>
</body>
</html>
