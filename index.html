<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Cloud Miner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src='//libtl.com/sdk.js' data-zone='11024792' data-sdk='show_11024792'></script>
</head>
<body>

    <div class="app-container">
        <!-- Live Crypto Price Ticker -->
        <div class="price-ticker">
            <marquee id="crypto-prices">Loading prices...</marquee>
        </div>

        <!-- Header Area -->
        <header>
            <div class="user-profile">
                <img src="https://via.placeholder.com/40" alt="User" id="user-pfp">
                <span id="user-name">Telegram User</span>
            </div>
            <div class="balance-container">
                <p>Total Balance</p>
                <h1 id="balance">0.00000000</h1>
                <span class="coin-type">USDT (Simulated)</span>
            </div>
        </header>

        <!-- Mining Dashboard -->
        <main id="mining-page" class="page active">
            <div class="mining-rig">
                <div class="fan-container">
                    <div class="fan active" id="rig-fan"></div>
                </div>
                <div class="stats">
                    <div class="stat-box">
                        <p>Hashrate</p>
                        <h3 id="hashrate">45.2 TH/s</h3>
                    </div>
                    <div class="stat-box">
                        <p>Status</p>
                        <h3 id="status" class="green">Mining...</h3>
                    </div>
                </div>
            </div>

            <div class="boost-section">
                <button class="boost-btn" onclick="watchAd()">🚀 Boost 2x Speed (Watch Ad)</button>
            </div>
        </main>

        <!-- Withdrawal Page -->
        <section id="withdraw-page" class="page">
            <h2>Secure Withdrawal</h2>
            <div class="withdrawal-form">
                <label>Select Coin</label>
                <select id="coin-select">
                    <option value="ton">TON (Mainnet)</option>
                    <option value="usdt">USDT (BEP20)</option>
                    <option value="btc">BTC</option>
                </select>
                <input type="text" placeholder="Enter Wallet Address">
                <button class="action-btn" onclick="attemptWithdraw()">Withdraw Now</button>
            </div>
            <div class="conditions">
                <p>⚠️ <b>Conditions:</b> Min $10, 5 Referrals, 10 Ad Boosts required.</p>
            </div>
        </section>

        <!-- History Page -->
        <section id="history-page" class="page">
            <h2>Mining Logs</h2>
            <div id="logs-container">
                <div class="log-item"><span>0.000002 BTC</span> <span>Completed</span></div>
            </div>
        </section>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <div onclick="showPage('mining-page')">⛏️<p>Mine</p></div>
            <div onclick="showPage('withdraw-page')">💳<p>Wallet</p></div>
            <div onclick="showPage('history-page')">📜<p>History</p></div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
